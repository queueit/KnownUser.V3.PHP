parameters:
  - name: ReleaseNotes
    displayName: 'Release Notes | Pull Request Body'
    type: string
    default: |
      ## Release Notes
      
      - Describe the changes here...

resources:
  repositories:
    - repository: GithubRepo
      type: github
      endpoint: GitHubInt32
      name: queueit/KnownUser.V3.PHP

    - repository: templates
      type: git
      name: step-templates

trigger:
  - none

pool:
  vmImage: "ubuntu-latest"

variables:
  - group: TeamQueueConnectGitHubConnections
  - name: GITHUB_PAT
    value: $(GitHubInt32PersonalAccessToken)
  - name: GITHUB_EMAIL
    value: dev@queue-it.com
  - name: GITHUB_NAME
    value: queue-it
  - name: GITHUB_REPO_NAME
    value: KnownUser.V3.PHP
  - name: SOURCE_REPO_PATH
    value: $(Pipeline.Workspace)/SourceRepo
  - name: RELEASE_REPO_PATH
    value: $(Pipeline.Workspace)/ReleaseRepo
  # SOURCE_BRANCH will be set dynamically to: release/{SDK_VERSION}-{BuildNumber}
  # Example: release/3.7.2-20250530.8

jobs:
  - job: TestAndSyncPR
    steps:
      # Checkout source repository (Azure DevOps)
      - checkout: self
        path: SourceRepo
        persistCredentials: true

      # Setup PHP environment using script instead of task
      - script: |
          sudo apt-get update
          sudo apt-get install -y php7.4 php7.4-cli php7.4-common
          php -v
        displayName: 'Setup PHP 7.4'

      # PHP Syntax Check
      - script: |
          find . -name "*.php" -not -path "./vendor/*" -print0 | while IFS= read -r -d '' file; do
            php -l "$file" || exit 1
          done
        displayName: 'Check PHP Syntax'
        workingDirectory: $(SOURCE_REPO_PATH)

      # Install Composer and Dependencies
      - script: |
          if [ -f "composer.json" ]; then
            curl -sS https://getcomposer.org/installer | php
            php composer.phar install --no-interaction --prefer-dist
          fi
        displayName: 'Install Dependencies'
        workingDirectory: $(SOURCE_REPO_PATH)/Tests

      # Run PHP Tests
      - script: php TestSuite.php
        displayName: 'Run PHP Tests'
        workingDirectory: $(SOURCE_REPO_PATH)/Tests

      # Extract SDK Version from composer.json
      - script: |
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
          if [ ! -f "composer.json" ]; then
            echo "Error: composer.json not found"
            exit 1
          fi
          SDK_VERSION=$(jq -r '.version' composer.json)
          if [ -z "$SDK_VERSION" ] || [ "$SDK_VERSION" = "null" ]; then
            echo "Error: Could not extract version from composer.json"
            exit 1
          fi
          BUILD_DATE=$(date +%Y%m%d)
          BUILD_COUNTER=$(printf "%03d" $(( $(Build.BuildId) % 1000 )) )
          BUILD_SUFFIX="$BUILD_DATE-$BUILD_COUNTER"
          echo "Extracted SDK version from composer.json: $SDK_VERSION"
          echo "Build suffix: $BUILD_SUFFIX"
          echo "##vso[task.setvariable variable=SDK_VERSION]$SDK_VERSION"
          echo "##vso[task.setvariable variable=BUILD_SUFFIX]$BUILD_SUFFIX"
          echo "##vso[build.updatebuildnumber]$SDK_VERSION-$BUILD_SUFFIX"
          if [[ ! $SDK_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Warning: Version format '$SDK_VERSION' is not standard semantic versioning (x.y.z)"
          fi
        displayName: 'Extract SDK Version from composer.json'
        workingDirectory: $(SOURCE_REPO_PATH)

      # Checkout target repository (GitHub) - Only if tests pass
      - checkout: GithubRepo
        path: ReleaseRepo
        fetchDepth: 0
        persistCredentials: true
        clean: true
        condition: succeeded()

      # Configure Git
      - script: |
          git config --global user.email $(GITHUB_EMAIL)
          git config --global user.name $(GITHUB_NAME)
        displayName: "Setup git configuration"
        condition: succeeded()

      # Create new branch in GitHub repo
      - script: |
          git checkout -b "release/$(SDK_VERSION)-$(BUILD_SUFFIX)"
          echo "##vso[task.setvariable variable=SOURCE_BRANCH]release/$(SDK_VERSION)-$(BUILD_SUFFIX)"
        displayName: "Create new branch in GitHub repo"
        workingDirectory: $(RELEASE_REPO_PATH)
        condition: succeeded()

      # Copy files from source to GitHub repo
      - script: |
          rsync -av --delete \
            --include="*.php" \
            --include="composer.json" \
            --include="Documentation/***" \
            --include="Tests/***" \
            --include="README.md" \
            --include="license.txt" \
            --include=".gitignore" \
            --include=".github/***" \
            --exclude="*" \
            --exclude=".git/" \
            $(SOURCE_REPO_PATH)/ \
            $(RELEASE_REPO_PATH)/
        displayName: "Copy files to GitHub repo"
        condition: succeeded()

      # Commit changes to GitHub repo
      - script: |
          git add .
          git commit -m "${{ parameters.ReleaseNotes }}"
          git push origin $(SOURCE_BRANCH)
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "##vso[task.setvariable variable=GITHUB_COMMIT_SHA]$COMMIT_SHA"
        displayName: "Commit and push changes to GitHub"
        workingDirectory: $(RELEASE_REPO_PATH)
        condition: succeeded()

      # Create Pull Request using REST API directly
      - script: |
          echo "Creating Pull Request from $(SOURCE_BRANCH) to main..."

          API_URL="https://api.github.com/repos/queueit/$(GITHUB_REPO_NAME)/pulls"
          TITLE="Release $(SDK_VERSION)"
          HEAD_BRANCH="$(SOURCE_BRANCH)"
          BASE_BRANCH="main"
          BODY="${{ parameters.ReleaseNotes }}"

          JSON_PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg head "$HEAD_BRANCH" \
            --arg base "$BASE_BRANCH" \
            --arg body "$BODY" \
            '{title: $title, head: $head, base: $base, body: $body, maintainer_can_modify: true}')

          RESPONSE=$(curl -s -w "%{http_code}" -o response.json -X POST \
            -H "Authorization: token $(GITHUB_PAT)" \
            -H "Accept: application/vnd.github+json" \
            -d "$JSON_PAYLOAD" \
            "$API_URL")

          echo "GitHub API response code: $RESPONSE"
          cat response.json

          if [ "$RESPONSE" -ne 201 ]; then
            echo "Failed to create Pull Request"
            exit 1
          fi
        displayName: "Create Pull Request on GitHub"
        env:
          GITHUB_PAT: $(GITHUB_PAT)
        condition: succeeded()

      - pwsh: |
          $headRef = & git rev-parse HEAD
          $uri = "https://dev.azure.com/queue-it/Queue-it/_apis/git/repositories/$(Build.Repository.ID)/annotatedtags?api-version=6.1-preview.1"
          $tagName = "$env:BUILD_BUILDNUMBER"
          $body = @{
            message = 'RC build'
            name = "$tagName"
            taggedObject = @{
              objectId = $headRef
              }
          } | ConvertTo-Json
          $headers = @{
            'Authorization' = "Bearer $env:SYSTEM_ACCESSTOKEN"
          }
          Invoke-RestMethod -Method Post -Uri "$($uri)" -Body $body -Headers $headers -ContentType 'application/json'
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        displayName: Tag head of repository with build number
        workingDirectory: $(SOURCE_REPO_PATH)

      - template: templates/adops/retainbuild.yaml@templates